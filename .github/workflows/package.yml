name: Build and package ParkEase

on:
  push:
    branches:
      - feature/advanced-analytics
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'README.md'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m py_compile backend/main.py

      - name: Package source
        run: |
          zip -r ParkEase-Updated.zip . \
            -x '.git/*' '*/node_modules/*' '*/dist/*' \
               'backend/parkease_demo.db' '**/__pycache__/*' \
               '**/.env' '**/.venv/*' '**/venv/*'

      - name: Upload updated source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ParkEase-Updated
          path: ParkEase-Updated.zip
          if-no-files-found: error
          retention-days: 14
